aid: svastia
name: Svastia
description: >-
  Svastia (Svastia Genetics Inc.) is a precision-genomics and oncology data
  company that bundles clinical research products with cutting-edge
  bioinformatics to accelerate precision cancer therapy. It offers DNA/RNA
  sequencing, exome and gene-panel assays, immune (B/T-cell) repertoire
  sequencing, cell-based drug-efficacy screening, therapeutic-antibody
  development toolkits, and siRNA design, together with biomarker analytics
  (Tumor Mutational Burden, Microsatellite Instability) and clinical reporting
  based on ACMG/ASCO guidelines. Svastia serves hospitals, diagnostics labs,
  researchers, and CROs, and runs a bespoke clinical/genetic data-collection
  service across a hospital network, with HL7-FHIR data exchange between EHR
  and Clinical Trial Management Systems. Products are delivered through a
  login-gated web portal; the company does not publish a public developer API.
  Backed by 500 Global; offices in San Francisco (USA) and Cambridge (UK).
